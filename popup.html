<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>RTPS Helper</title>
  <style>
    :root {
      --ink: #1d2740;
      --ink-soft: #5b6479;
      --paper: #fbf7ef;
      --card: #ffffff;
      --line: #e6dfd0;
      --saffron: #e7861b;
      --saffron-soft: #fdeccf;
      --green: #1f7a5a;
      --green-dark: #176046;
      --red: #b3372d;
    }

    * { box-sizing: border-box; }

    body {
      width: 330px;
      margin: 0;
      padding: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Segoe UI", "Noto Sans", "Noto Sans Devanagari", "Nirmala UI", system-ui, sans-serif;
      font-size: 13px;
    }

    /* ---------- header ---------- */
    .header {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 14px 16px 12px;
      background: var(--ink);
      color: #fff;
      border-bottom: 4px solid var(--saffron);
    }
    .mark {
      width: 38px;
      height: 38px;
      flex: none;
      border-radius: 10px;
      background: var(--saffron);
      color: var(--ink);
      font-weight: 800;
      font-size: 15px;
      letter-spacing: -0.5px;
      display: grid;
      place-items: center;
      box-shadow: inset 0 -3px 0 rgba(0,0,0,0.15);
    }
    .header h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }
    .header small {
      display: block;
      margin-top: 1px;
      color: #c4cadb;
      font-size: 11px;
    }

    .body { padding: 14px 16px 12px; }

    .label {
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--ink-soft);
      margin: 0 0 6px;
    }

    /* ---------- new profile row ---------- */
    .input-row {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
    }
    .input-row input {
      flex: 1;
      min-width: 0;
      padding: 9px 10px;
      border: 1.5px solid var(--line);
      border-radius: 8px;
      background: var(--card);
      color: var(--ink);
      font-size: 13px;
      outline: none;
    }
    .input-row input:focus {
      border-color: var(--saffron);
      box-shadow: 0 0 0 3px var(--saffron-soft);
    }
    .btn-save {
      padding: 9px 14px;
      border: none;
      border-radius: 8px;
      background: var(--ink);
      color: #fff;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-save:hover { background: #2b3a5e; }

    /* ---------- profile list ---------- */
    .profile-list {
      max-height: 170px;
      overflow-y: auto;
      border: 1.5px solid var(--line);
      border-radius: 10px;
      background: var(--card);
      margin-bottom: 12px;
    }
    .profile-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 9px 12px;
      border-bottom: 1px solid #f1ecdf;
      border-left: 4px solid transparent;
      cursor: pointer;
    }
    .profile-item:last-child { border-bottom: none; }
    .profile-item:hover { background: #fdfaf3; }
    .profile-item.selected {
      background: var(--saffron-soft);
      border-left-color: var(--saffron);
    }
    .profile-item .pname { font-weight: 600; word-break: break-word; }
    .profile-item .pcount { color: var(--ink-soft); font-size: 11px; margin-left: 4px; }
    .profile-item .select-btn {
      flex: none;
      padding: 3px 11px;
      border: 1.5px solid var(--ink);
      border-radius: 999px;
      background: transparent;
      color: var(--ink);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    .profile-item .select-btn:hover { background: var(--ink); color: #fff; }
    .profile-item.selected .select-btn { background: var(--ink); color: #fff; }

    .empty {
      padding: 22px 12px;
      text-align: center;
      color: var(--ink-soft);
    }
    .empty .big { font-size: 26px; margin-bottom: 4px; }
    .empty .hint { display: block; margin-top: 2px; font-size: 11px; }

    .profile-list::-webkit-scrollbar { width: 5px; }
    .profile-list::-webkit-scrollbar-thumb { background: #d8cfba; border-radius: 3px; }

    /* ---------- main actions ---------- */
    .btn-row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .btn-fill {
      flex: 1;
      padding: 11px 12px;
      border: none;
      border-radius: 10px;
      background: var(--green);
      color: #fff;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 2px 0 #145a43;
    }
    .btn-fill:hover { background: #1a6b4f; }
    .btn-fill:disabled { opacity: 0.65; cursor: default; box-shadow: none; }
    .btn-fill:active { transform: translateY(1px); box-shadow: 0 1px 0 #145a43; }
    .btn-delete {
      padding: 11px 14px;
      border: 1.5px solid #e3c3bf;
      border-radius: 10px;
      background: transparent;
      color: var(--red);
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }
    .btn-delete:hover { background: #fbeceb; }

    /* ---------- reminder note ---------- */
    .note {
      display: flex;
      gap: 8px;
      padding: 8px 10px;
      margin-bottom: 10px;
      background: var(--saffron-soft);
      border-left: 4px solid var(--saffron);
      border-radius: 4px 8px 8px 4px;
      color: #6a4306;
      font-size: 11.5px;
      line-height: 1.45;
    }

    /* ---------- status ---------- */
    .status {
      display: none;
      padding: 8px 12px;
      margin-bottom: 10px;
      border-radius: 8px;
      font-size: 12.5px;
      text-align: center;
    }
    .status.success { background: #dcf1e7; color: #165c43; display: block; }
    .status.error   { background: #f8dedb; color: #8c2a22; display: block; }
    .status.info    { background: #e3e8f5; color: #26346b; display: block; }
    .status { align-items: flex-start; gap: 8px; text-align: left; }
    .status.success, .status.error, .status.info { display: flex; }
    .status-text { flex: 1; }
    .status-close {
      flex: none;
      margin: -2px -4px 0 0;
      padding: 0 5px;
      border: none;
      background: none;
      color: inherit;
      font-size: 18px;
      line-height: 1;
      opacity: 0.55;
      cursor: pointer;
    }
    .status-close:hover { opacity: 1; }

    /* ---------- export / import ---------- */
    .bottom-row {
      display: flex;
      justify-content: center;
      gap: 16px;
      padding-top: 8px;
      border-top: 1px dashed var(--line);
    }
    .bottom-row button {
      border: none;
      background: none;
      color: var(--ink-soft);
      font-size: 12px;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    .bottom-row button:hover { color: var(--ink); }

    .footer {
      padding: 0 16px 12px;
      text-align: center;
      font-size: 10.5px;
      color: #9a9482;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="mark">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M6 3h8l4 4v14H6z"/>
        <path d="M14 3v4h4"/>
        <path d="M9 14.5l2 2 4-4.5"/>
      </svg>
    </div>
    <div>
      <h1>RTPS Helper</h1>
    </div>
  </div>

  <div class="body">
    <p class="label">New profile</p>
    <div class="input-row">
      <input type="text" id="profileInput" placeholder="e.g. Rahul – Residence" />
      <button id="btnSaveProfile" class="btn-save">Save</button>
    </div>

    <p class="label">Saved profiles</p>
    <div id="profileList" class="profile-list">
      <div class="empty">
        <div class="big">📂</div>
        No saved profiles
        <span class="hint">Fill a form and click Save</span>
      </div>
    </div>

    <div class="btn-row">
      <button id="btnFill" class="btn-fill">Fill form</button>
      <button id="btnDelete" class="btn-delete">Delete</button>
    </div>

    <div class="note">
      <span>💡</span>
      <span><b>Save your profile before choosing</b> the Panchayat / Nagar Nigam name. That dropdown isn't auto-filled, so pick it yourself after Fill.</span>
    </div>

    <div id="status" class="status"></div>

    <div class="bottom-row">
      <button id="btnExport">Export profiles</button>
      <button id="btnImport">Import profiles</button>
      <input type="file" id="fileInput" accept=".json" style="display:none" />
    </div>
  </div>

  <div class="footer">Data stays in your browser · serviceonline.bihar.gov.in</div>

  <script src="popup.js"></script>
</body>
</html>
